name: Tests
on:
  push:
  pull_request:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: docker
    # docker:cli has the Docker client (the runner points it at its
    # docker-in-docker daemon via DOCKER_HOST) but no Node, so check out with
    # plain git instead of actions/checkout.
    container:
      image: docker:cli
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          apk add --no-cache git >/dev/null
          git clone --quiet "${SERVER%%://*}://ci:${TOKEN}@${SERVER#*://}/${{ github.repository }}.git" .
          git checkout --quiet ${{ github.sha }}
      # Build the real image (tests/ is copied in by `COPY . .`) and run the
      # suite inside it, so the image smoke tests (nmap, bw) run too.
      - name: Build image
        run: docker build -q -t homelab-documenter-ci:${{ github.sha }} .
      # Reports (#16): a page per run with each test's result, duration,
      # logs and tracebacks; coverage (summary in the log, HTML report);
      # JUnit XML. Written in the container, copied out below.
      - name: Run tests
        run: |
          docker run --name tests-${{ github.sha }} -w /app --entrypoint sh \
            homelab-documenter-ci:${{ github.sha }} -c '
              pip install -q --disable-pip-version-check -r requirements-dev.txt &&
              python -m pytest -v -rxXs \
                --html=reports/tests.html --self-contained-html \
                --junitxml=reports/junit.xml \
                --cov --cov-report=term-missing \
                --cov-report=html:reports/coverage'
      # Kept even when tests fail: that's when they're most useful
      - name: Copy reports out
        if: always()
        run: docker cp tests-${{ github.sha }}:/app/reports ./reports || true
      # upload-artifact runs on Node, which docker:cli doesn't have; the
      # Forgejo fork, since actions/upload-artifact@v4 doesn't work on Forgejo
      - name: Install Node for the upload
        if: always()
        run: apk add --no-cache nodejs >/dev/null
      # The upload must never hold up or fail a run: the tests decide that
      - name: Upload reports
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
      - name: Clean up
        if: always()
        run: |
          docker rm tests-${{ github.sha }} || true
          docker rmi homelab-documenter-ci:${{ github.sha }} || true
