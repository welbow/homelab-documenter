[pytest]
testpaths = tests
# Known bugs are marked xfail with their issue number; strict means that
# when one gets fixed the test "unexpectedly passes" and fails the run,
# as a reminder to remove the marker.
xfail_strict = true
addopts = -p no:cacheprovider
# Any warning fails the run (no need for -W error, which would override
# the exception below). The exception: dominate checks for an asyncio loop
# with get_event_loop(), which warns on Python 3.12+ when there is none;
# harmless for our synchronous pipeline, and only dominate can fix it.
filterwarnings =
    error
    ignore:There is no current event loop:DeprecationWarning:dominate\..*
