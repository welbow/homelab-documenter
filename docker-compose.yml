version: '2.1'

services:
  builder:
    build:
      context: ./
    stdin_open: true
    tty: true
    # Bitwarden API key, read from the gitignored .env (see .env.example).
    environment:
      BW_CLIENTID: ${BW_CLIENTID:-}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET:-}
    volumes:
      - './conf/:/app/conf/'
      - './input/:/app/input/'
      - './output/:/app/output/'
