# Settings shared by the preview and build services
x-packet: &packet
  build:
    context: ./
  image: homelab-documenter
  # Interactive, for the master password prompt when it isn't stored
  stdin_open: true
  tty: true
  environment:
    # Encrypted credentials (#22), the only place secrets are kept: this
    # install's key and the .enc files (see the secrets service below)
    KEYS_DIR: /keys
    SECRETS_DIR: /app/secrets
    # Optional; overrides log_level in config.json (default INFO)
    LOG_LEVEL: ${LOG_LEVEL:-}
    # Optional; plugins to skip, e.g. 500,100 (see .env.example)
    SKIP_PLUGINS: ${SKIP_PLUGINS:-}
    # Time zone for the generation stamp, e.g. America/New_York (default UTC)
    TZ: ${TZ:-}
    # The page is generated in memory (tmpfs below), never on disk
    BUILD_DIR: /app/build
    # Preview listens on all interfaces inside the container; the port is
    # only published on the host's 127.0.0.1
    PREVIEW_HOST: 0.0.0.0
  tmpfs:
    - /app/build
  volumes:
    - './conf/:/app/conf/'
    - './input/:/app/input/'
    # Extra files shipped with the page (e.g. stylesheets); read-only
    - './output/:/app/output/:ro'
    # Encrypted credentials; read-only here, written by the secrets service
    - './secrets/:/app/secrets/:ro'
    - 'keys:/keys'

# This install's private key (#22): in Docker's own storage, not in the
# repos or your folders. Losing it only means setting the credentials again.
volumes:
  keys:
    name: homelab-documenter-keys

# Always use `docker compose run --rm` so no container is left behind.
services:
  # Generate the packet and serve it until Ctrl-C:
  #   docker compose run --rm --service-ports preview
  # then open http://127.0.0.1:8000 and print from the browser.
  # The service's options are in its entrypoint, so extra options given
  # to `docker compose run` (e.g. --skip 500) add to them.
  preview:
    <<: *packet
    entrypoint: ['/app/entrypoint.sh', '--preview']
    ports:
      - '127.0.0.1:8000:8000'

  # Generate the packet and copy it, plus the files in output/, to the
  # folder mounted at /export (e.g. a USB stick):
  #   docker compose run --rm build
  # /export has no mount here on purpose: add one in
  # docker-compose.override.yml (see the .example). Without it the run
  # stops with an error instead of writing into the container.
  # Runs unattended once the credentials are stored (secrets service).
  build:
    <<: *packet
    entrypoint: ['/app/entrypoint.sh', '--export', '/export', '--require-mount']

  # Store, list, check or remove encrypted credentials (#22); values are
  # never printed:
  #   docker compose run --rm secrets set bw_master_password   (prompts)
  #   docker compose run --rm secrets list
  #   docker compose run --rm secrets check
  secrets:
    image: homelab-documenter
    build:
      context: ./
    stdin_open: true
    tty: true
    environment:
      KEYS_DIR: /keys
      SECRETS_DIR: /app/secrets
    volumes:
      - './secrets/:/app/secrets/'
      - 'keys:/keys'
    entrypoint: ['python', '/app/secrets_cli.py']

  # Test suite: `docker compose run --rm test` (extra args go to pytest).
  # Mounts the working tree, so code changes need no rebuild.
  test:
    build:
      context: ./
    working_dir: /work
    volumes:
      - './:/work'
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    entrypoint:
      - sh
      - -c
      - pip install -q --disable-pip-version-check -r requirements-dev.txt && exec python -m pytest "$$@"
      - pytest
