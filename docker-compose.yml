version: '2.1'

services:
  builder:
    build:
      context: ./
    stdin_open: true
    tty: true
    # Bitwarden API key, read from the gitignored .env (see .env.example).
    environment:
      BW_CLIENTID: ${BW_CLIENTID:-}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET:-}
    volumes:
      - './conf/:/app/conf/'
      - './input/:/app/input/'
      - './output/:/app/output/'

  # Test suite: `docker compose run --rm test` (extra args go to pytest).
  # Mounts the working tree, so code changes need no rebuild.
  test:
    build:
      context: ./
    working_dir: /work
    volumes:
      - './:/work'
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    entrypoint:
      - sh
      - -c
      - pip install -q --disable-pip-version-check -r requirements-dev.txt && exec python -m pytest "$$@"
      - pytest
